# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

config:
  edition: 3

streams:
  workspace:
    auto_subscribe: true
    with:
      user_channels: |
        SELECT c.id
        FROM channels c
        JOIN channel_members cm ON cm.channel_id = c.id
        WHERE cm.member_type = 'user'
          AND cm.member_id = auth.user_id()
    queries:
      - SELECT * FROM users
      - SELECT * FROM agents
      - SELECT * FROM channel_members WHERE channel_id IN (SELECT id FROM user_channels)
      - SELECT * FROM messages WHERE channel_id IN (SELECT id FROM user_channels)
      - SELECT * FROM documents WHERE channel_id IN (SELECT id FROM user_channels)
      - SELECT * FROM agent_runs WHERE channel_id IN (SELECT id FROM user_channels)

  # BEGIN GENERATED STREAMS
  # END GENERATED STREAMS
